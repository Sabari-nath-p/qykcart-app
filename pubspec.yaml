name: qykcart_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.10.3 <4.0.0'

dependencies:
  country_pickers: ^3.0.1
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  get: ^4.7.3
  cupertino_icons: ^1.0.8 


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/font/inter.ttf